spring.application.name=ecopraia
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ecopraia}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
server.port=${PORT:8080}

spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# OpenRouteService (rota: distância real + tempo de chegada)
# Crie a chave gratuita em https://openrouteservice.org/dev/#/signup
# Configure a variável de ambiente ORS_API_KEY (local: .env / Render: Environment)
openrouteservice.api-key=${ORS_API_KEY}